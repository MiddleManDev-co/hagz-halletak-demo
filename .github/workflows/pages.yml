name: Validate and deploy static demo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check i18n.js
          node --check app.js
          node --check extras.js
          node --check audit.js
          node --check polish.js
          node --check navigator.js
          node --check navigator-share.js
          node --check business-intelligence.js
          node --check persona-ui.js
          node --check venue-360.js
          node --check ui-refinement.js
          node --check dawwar-pilot.js
          node --check i18n.test.js
          node --check demo.integrity.test.js
          node --check navigator.test.js
          node --check navigator-share.test.js
          node --check business-intelligence.test.js
          node --check persona-ui.test.js
          node --check venue-360.test.js
          node --check ui-refinement.test.js
          node --check dawwar-pilot.test.js

      - name: Run test suite
        run: |
          node i18n.test.js
          node demo.integrity.test.js
          node navigator.test.js
          node navigator-share.test.js
          node business-intelligence.test.js
          node persona-ui.test.js
          node venue-360.test.js
          node ui-refinement.test.js
          node dawwar-pilot.test.js

      - name: Verify static entry files
        run: |
          for f in \
            index.html styles.css i18n.css audit.css polish.css navigator.css \
            navigator-share.css business-intelligence.css persona-ui.css ui-premium.css \
            venue-360.css ui-refinement.css dawwar-pilot.css i18n.js app.js extras.js \
            audit.js polish.js navigator.js navigator-share.js business-intelligence.js \
            persona-ui.js venue-360.js ui-refinement.js dawwar-pilot.js; do
            test -f "$f"
          done
          for marker in \
            styles.css i18n.css audit.css polish.css navigator.css navigator-share.css \
            business-intelligence.css persona-ui.css ui-premium.css venue-360.css \
            ui-refinement.css dawwar-pilot.css i18n.js app.js extras.js audit.js polish.js \
            navigator.js navigator-share.js business-intelligence.js persona-ui.js \
            venue-360.js ui-refinement.js dawwar-pilot.js; do
            grep -q "$marker" index.html
          done
          grep -q 'data-lang="ar"' index.html
          grep -q 'data-lang="en"' index.html
          grep -q '<title>Dawwar' index.html

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
