@media(prefers-reduced-motion:reduce){*{transition:none!important}}

 // ---- مسؤول القاعة ----

 ['y35','gapa','سجل التواصل مع القاعة','الإدارة','gap','مين كلم مين وإمتى وقال إيه. في مرحلة الـ ٢٥ قاعة، ده هو الشغل نفسه.'],
 ['y36','gapa','تقارير التسوية','الإدارة','gap','بعد الدفع: كام دخل، كام اتحوّل، كام لسه، وكام عمولة اتخصمت. يومي.']
];
(function(){
'use strict';

var TAG={live:['شغالة','t-live'],demo:['شاشة عرض','t-demo'],future:['رؤية مستقبلية','t-future'],
         gap:['ناقص · لازم','t-gap'],gapl:['ناقص · بعدين','t-gapl']};
var VERD=[['keep','خليها'],['change','عدّلها'],['drop','اشيلها'],['ask','نتكلم فيها']];
var VLABEL={keep:'خليها',change:'عدّلها',drop:'اشيلها',ask:'نتكلم فيها'};
// a verdict read back from the sheet is untrusted input: only ever resolve
// it through an own-property lookup, never straight off the object.
function vlabel(v){return Object.prototype.hasOwnProperty.call(VLABEL,v)?VLABEL[v]:''}

var LS={api:'dawwar-review-api',pass:'dawwar-review-pass',me:'dawwar-review-me',mine:'dawwar-review-mine'};
function get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}

// The Google Sheet web app. ?api=... on the link still overrides it, so a new
// deployment can be tried without a release.
var API='https://script.google.com/macros/s/AKfycbzezUMFjIGmeU27lpheJehyDyocswaqxfuGNy3u4ASsjDBVZn3xfEdrt1LbyFzTguCgJA/exec';
(function(){
  // precedence: ?api= wins (lets a new deployment be tried), then the value
  // baked in above, then whatever a previous visit saved. A stale saved value
  // must never shadow a newly released endpoint.
  var qp=new URLSearchParams(location.search);
  var fromQuery=qp.get('api');
  if(fromQuery){API=fromQuery}
  else if(!API){API=get(LS.api)}
  if(API)set(LS.api,API);
  if(qp.get('pass'))set(LS.pass,qp.get('pass'));
})();

var me=get(LS.me), pass=get(LS.pass);
var mine={};
var all=[];
var tab='vote', filter='all', q='', dirty={}, timer=null, syncing=false;
var agg={byFeat:{},people:[]};

try{mine=JSON.parse(get(LS.mine)||'{}')||{}}catch(e){mine={}}

function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rec(id){return mine[id]||(mine[id]={v:'',note:''})}
function answered(){var n=0;for(var k in mine){if(mine[k].v||mine[k].note)n++}return n}
function saveLocal(){set(LS.mine,JSON.stringify(mine))}
function status(cls,txt){var e=document.getElementById('sync');if(e){e.className='sync '+cls;e.textContent=txt}}

function reduceRows(rows){
  var m={};
  rows.forEach(function(r){
    if(!r.id||!r.person)return;
    var k=r.person+' '+r.id;
    if(!m[k]||r.t>=m[k].t)m[k]=r;
  });
  var byFeat={},people={};
  Object.keys(m).forEach(function(k){
    var r=m[k];
    if(!r.v&&!r.note)return;
    (byFeat[r.id]=byFeat[r.id]||[]).push(r);
    people[r.person]=true;
  });
  return {byFeat:byFeat,people:Object.keys(people).sort()};
}

function contested(){
  var out=[];
  Object.keys(agg.byFeat).forEach(function(id){
    var vs=agg.byFeat[id].filter(function(r){return r.v});
    if(vs.length<2)return;
    var s={};vs.forEach(function(r){s[r.v]=1});
    if(Object.keys(s).length>1)out.push(id);
  });
  return out;
}

function queue(id){dirty[id]=true;saveLocal();clearTimeout(timer);timer=setTimeout(flush,1500);paintStats()}

function flush(){
  var ids=Object.keys(dirty);
  if(!ids.length)return;
  if(!API){status('s-local','محفوظ على جهازك — الرابط مش فيه عنوان الشيت');return}
  var items=ids.map(function(id){return {id:id,v:mine[id].v||'',note:mine[id].note||''}});
  dirty={};
  status('s-busy','بيحفظ');
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({pass:pass,person:me,items:items})})
   .then(function(r){return r.json()})
   .then(function(j){
     if(j&&j.ok){status('s-ok','اتحفظ');setTimeout(function(){pull()},600)}
     else if(j&&j.error==='bad_pass'){status('s-err','كود الدخول غلط')}
     else{items.forEach(function(it){dirty[it.id]=true});status('s-err','الحفظ فشل — محفوظ على جهازك')}
   })
   .catch(function(){items.forEach(function(it){dirty[it.id]=true});
     status('s-err','مفيش اتصال — محفوظ على جهازك')});
}

function pull(then){
  if(!API){agg={byFeat:{},people:[]};if(then)then();return}
  if(syncing){if(then)then();return}
  syncing=true;
  fetch(API+(API.indexOf('?')>-1?'&':'?')+'pass='+encodeURIComponent(pass))
   .then(function(r){return r.json()})
   .then(function(j){
     syncing=false;
     if(j&&j.ok){all=j.rows||[];agg=reduceRows(all);paintStats();
       if(tab==='stats')render();else paintOthers();}
     else if(j&&j.error==='bad_pass')status('s-err','كود الدخول غلط');
     if(then)then();
   })
   .catch(function(){syncing=false;if(then)then()});
}

function renderGate(){
  document.getElementById('root').innerHTML=
   '<div class="gate"><h2>مراجعة فيتشرز دوّر</h2>'
   +'<p>اكتب اسمك وكود الدخول مرة واحدة. رأيك بيتحفظ باسمك عشان نعرف بعدين مين شايف إيه وليه.</p>'
   +'<label>اسمك</label><input id="gName" type="text" value="'+esc(me)+'" placeholder="مثلاً: كريم">'
   +'<label>كود الدخول</label><input id="gPass" type="password" value="'+esc(pass)+'" placeholder="اللي اتبعتلك">'
   +(API?'':'<div class="banner"><b>تنبيه:</b> الرابط ده مش فيه عنوان الشيت، فرأيك هيتحفظ على جهازك بس. اطلب الرابط الكامل.</div>')
   +'<div style="margin-top:18px"><button class="btn primary" id="gGo">يلا نبدأ</button></div></div>';
  document.getElementById('gGo').onclick=function(){
    var n=document.getElementById('gName').value.trim();
    var p=document.getElementById('gPass').value.trim();
    if(!n){alert('اكتب اسمك الأول');return}
    me=n;pass=p;set(LS.me,n);set(LS.pass,p);
    pull(function(){render()});
  };
}

function paintStats(){
  var e=document.getElementById('stats');if(!e)return;
  e.innerHTML='<span>ردّيت على: <b>'+answered()+'</b> من <b>'+F.length+'</b></span>'
    +'<span>المشاركين: <b>'+(agg.people.length||1)+'</b></span>'
    +'<span>عليها خلاف: <b>'+contested().length+'</b></span>';
}

function match(f){
  if(filter==='all'){}
  else if(filter==='mine'){if(!(mine[f[0]]&&(mine[f[0]].v||mine[f[0]].note)))return false}
  else if(filter==='todo'){if(mine[f[0]]&&mine[f[0]].v)return false}
  else if(filter==='hot'){if(contested().indexOf(f[0])<0)return false}
  else if(f[1]!==filter)return false;
  if(!q)return true;
  return (f[2]+' '+f[3]+' '+f[5]).toLowerCase().indexOf(q)>-1;
}

function othersFor(id){
  var rows=(agg.byFeat[id]||[]).filter(function(r){return r.person!==me});
  if(!rows.length)return '';
  var counts={},notes=[];
  rows.forEach(function(r){
    if(r.v)counts[r.v]=(counts[r.v]||0)+1;
    if((r.note||'').trim())notes.push(r);
  });
  var chips=Object.keys(counts).map(function(v){
    return '<span class="oth"><b>'+counts[v]+'</b> '+esc(vlabel(v))+'</span>'}).join('');
  var nh=notes.map(function(r){
    return '<div class="othnote"><b>'+esc(r.person)+':</b> '+esc(r.note)+'</div>'}).join('');
  return (chips?'<div class="others">'+chips+'</div>':'')+(nh?'<div class="othnotes">'+nh+'</div>':'');
}

function paintOthers(){
  Array.prototype.forEach.call(document.querySelectorAll('.feat'),function(el){
    var id=el.getAttribute('data-id');
    Array.prototype.forEach.call(el.querySelectorAll('.others,.othnotes'),function(n){n.remove()});
    var h=othersFor(id);
    if(h)el.insertAdjacentHTML('beforeend',h);
  });
}

function voteView(){
  var html='',any=false;
  GROUPS.forEach(function(g){
    var items=F.filter(function(f){return f[1]===g.id&&match(f)});
    if(!items.length)return;
    any=true;
    html+='<section class="grp"><h2>'+esc(g.name)+' <span class="c">'+items.length+'</span></h2>'
        +'<p class="gd">'+esc(g.desc)+'</p>';
    items.forEach(function(f){
      var r=rec(f[0]),t=TAG[f[4]]||TAG.live;
      var cls=(f[4]==='gap'?' gap':(f[4]==='gapl'?' gapl':''));
      html+='<article class="feat'+cls+'" data-id="'+f[0]+'">'
       +'<div class="fname">'+esc(f[2])+' <span class="route">'+esc(f[3])+'</span> <span class="tag '+t[1]+'">'+t[0]+'</span></div>'
       +'<p class="fdesc">'+f[5]+'</p>'
       +'<div class="verdicts">'+VERD.map(function(v){
           return '<button class="vbtn'+(r.v===v[0]?' on':'')+'" data-v="'+v[0]+'" data-id="'+f[0]+'">'+v[1]+'</button>'}).join('')+'</div>'
       +'<textarea class="'+(r.note?'note-has':'')+'" data-id="'+f[0]+'" rows="'+(r.note?3:1)+'" placeholder="ليه؟ اكتب سببك">'+esc(r.note)+'</textarea>'
       +othersFor(f[0])
       +'</article>';
    });
    html+='</section>';
  });
  if(!any)html='<p class="empty">مفيش نتايج.</p>';
  return html;
}

function bar(counts,total){
  var order=['keep','change','drop','ask'],h='';
  order.forEach(function(v){
    var n=counts[v]||0;if(!n)return;
    h+='<i class="i-'+v+'" style="width:'+Math.round(n/total*100)+'%"></i>';
  });
  return '<span class="split">'+h+'</span>';
}

function statsView(){
  if(!API)return '<div class="banner"><b>التحليلات محتاجة الشيت.</b> الرابط ده مش فيه عنوان الشيت، فمفيش أصوات نجمّعها.</div>';
  var ids=Object.keys(agg.byFeat);
  if(!ids.length)return '<p class="empty">لسه مفيش أصوات. أول ما حد يصوّت هتظهر هنا.</p>';

  var title={};F.forEach(function(f){title[f[0]]=f});

  // per-person coverage
  var per={};
  agg.people.forEach(function(p){per[p]={keep:0,change:0,drop:0,ask:0,notes:0,total:0}});
  ids.forEach(function(id){
    agg.byFeat[id].forEach(function(r){
      if(!per[r.person])return;
      if(r.v&&vlabel(r.v)){per[r.person][r.v]=(per[r.person][r.v]||0)+1;per[r.person].total++}
      if((r.note||'').trim())per[r.person].notes++;
    });
  });

  var hot=contested().map(function(id){
    var vs=agg.byFeat[id].filter(function(r){return r.v});
    var c={};vs.forEach(function(r){c[r.v]=(c[r.v]||0)+1});
    var top=Math.max.apply(null,Object.keys(c).map(function(k){return c[k]}));
    return {id:id,c:c,n:vs.length,split:1-(top/vs.length)};
  }).sort(function(a,b){return b.split-a.split||b.n-a.n});

  var agree=ids.filter(function(id){
    var vs=agg.byFeat[id].filter(function(r){return r.v});
    if(vs.length<2)return false;
    var s={};vs.forEach(function(r){s[r.v]=1});
    return Object.keys(s).length===1;
  }).map(function(id){
    var vs=agg.byFeat[id].filter(function(r){return r.v});
    return {id:id,v:vs[0].v,n:vs.length};
  }).sort(function(a,b){return b.n-a.n});

  var drops=ids.map(function(id){
    var c={};agg.byFeat[id].forEach(function(r){if(r.v)c[r.v]=(c[r.v]||0)+1});
    return {id:id,score:(c.drop||0)*2+(c.change||0),c:c};
  }).filter(function(x){return x.score>0}).sort(function(a,b){return b.score-a.score}).slice(0,15);

  var h='<div class="legend">'
   +'<span><i class="dot i-keep"></i> خليها</span><span><i class="dot i-change"></i> عدّلها</span>'
   +'<span><i class="dot i-drop"></i> اشيلها</span><span><i class="dot i-ask"></i> نتكلم فيها</span></div>';

  h+='<h3>مين شارك وردّ على كام</h3><div class="tw"><table><thead><tr><th>الشخص</th><th class="n">ردّ على</th><th class="n">خليها</th><th class="n">عدّلها</th><th class="n">اشيلها</th><th class="n">نتكلم</th><th class="n">ملاحظات</th></tr></thead><tbody>';
  agg.people.forEach(function(p){var x=per[p];
    h+='<tr><td>'+esc(p)+'</td><td class="n">'+x.total+' / '+F.length+'</td><td class="n">'+(x.keep||0)+'</td><td class="n">'+(x.change||0)+'</td><td class="n">'+(x.drop||0)+'</td><td class="n">'+(x.ask||0)+'</td><td class="n">'+x.notes+'</td></tr>';
  });
  h+='</tbody></table></div>';

  h+='<h3>الفيتشرز اللي فيها خلاف ('+hot.length+')</h3>';
  h+='<p class="gd">دي اللي محتاجة قعدة. مرتبة من الأكتر خلافًا.</p>';
  if(!hot.length)h+='<p class="empty">مفيش خلاف لحد دلوقتي.</p>';
  else{
    h+='<div class="tw"><table><thead><tr><th>الفيتشر</th><th>التوزيع</th><th class="n">أصوات</th><th>مين قال إيه</th></tr></thead><tbody>';
    hot.slice(0,25).forEach(function(x){
      var f=title[x.id]||['','','?'];
      var who=agg.byFeat[x.id].filter(function(r){return r.v}).map(function(r){
        return esc(r.person)+': '+esc(vlabel(r.v))}).join(' · ');
      h+='<tr><td>'+esc(f[2])+'</td><td>'+bar(x.c,x.n)+'</td><td class="n">'+x.n+'</td><td>'+who+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }

  h+='<h3>الأكتر طلبًا للتعديل أو الشيل</h3>';
  if(!drops.length)h+='<p class="empty">مفيش.</p>';
  else{
    h+='<div class="tw"><table><thead><tr><th>الفيتشر</th><th class="n">عدّلها</th><th class="n">اشيلها</th></tr></thead><tbody>';
    drops.forEach(function(x){var f=title[x.id]||['','','?'];
      h+='<tr><td>'+esc(f[2])+'</td><td class="n">'+(x.c.change||0)+'</td><td class="n">'+(x.c.drop||0)+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }

  h+='<h3>متفق عليها ('+agree.length+')</h3>';
  h+='<p class="gd">اتنين أو أكتر قالوا نفس الحاجة. دي مش محتاجة نقاش.</p>';
  if(!agree.length)h+='<p class="empty">لسه.</p>';
  else{
    h+='<div class="tw"><table><thead><tr><th>الفيتشر</th><th>الاتفاق</th><th class="n">أصوات</th></tr></thead><tbody>';
    agree.slice(0,40).forEach(function(x){var f=title[x.id]||['','','?'];
      h+='<tr><td>'+esc(f[2])+'</td><td>'+esc(vlabel(x.v))+'</td><td class="n">'+x.n+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  return h;
}

function render(){
  if(!me){renderGate();return}
  var chips=[['all','الكل'],['todo','لسه مردّتش'],['mine','اللي ردّيت عليه'],['hot','فيها خلاف']]
    .concat(GROUPS.map(function(g){return [g.id,g.name]}));
  document.getElementById('root').innerHTML=
   '<header><div class="wrap" style="padding-bottom:0">'
   +'<div class="htop"><div><h1>مراجعة فيتشرز دوّر</h1>'
   +'<p class="sub">صوّت واكتب سببك. كل واحد بيشوف رأي الباقيين تحت كل فيتشر.</p></div>'
   +'<div style="text-align:left"><div class="who">داخل باسم <b>'+esc(me)+'</b> · <a href="#" id="chg" style="color:var(--clay-600)">غيّر</a></div>'
   +'<div id="sync" class="sync s-idle" style="margin-top:6px">جاهز</div></div></div>'
   +'<div class="stats" id="stats"></div>'
   +'<div class="tabs"><button class="tab'+(tab==='vote'?' on':'')+'" data-t="vote">التصويت</button>'
   +'<button class="tab'+(tab==='stats'?' on':'')+'" data-t="stats">التحليلات</button></div>'
   +(tab==='vote'?'<div class="controls"><input type="search" id="q" placeholder="دوّر على فيتشر" value="'+esc(q)+'">'
      +chips.map(function(c){return '<button class="chip'+(filter===c[0]?' on':'')+'" data-f="'+c[0]+'">'+esc(c[1])+'</button>'}).join('')
      +'</div>':'')
   +'</div></header><div class="wrap">'
   +(tab==='vote'?voteView():statsView())
   +'</div>'
   +'<div class="bar"><button class="btn" id="refresh">حدّث الأصوات</button>'
   +'<button class="btn primary" id="saveNow">احفظ دلوقتي</button></div>';
  paintStats();
  wire();
}

function wire(){
  var c=document.getElementById('chg');
  if(c)c.onclick=function(ev){ev.preventDefault();me='';renderGate()};
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
    b.onclick=function(){tab=this.getAttribute('data-t');if(tab==='stats')pull(function(){render()});else render()}});
  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(b){
    b.onclick=function(){filter=this.getAttribute('data-f');render()}});
  var qEl=document.getElementById('q');
  if(qEl)qEl.oninput=function(){var pos=this.selectionStart;q=this.value.trim().toLowerCase();render();
    var n=document.getElementById('q');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}};
  Array.prototype.forEach.call(document.querySelectorAll('.vbtn'),function(b){
    b.onclick=function(){
      var id=this.getAttribute('data-id'),v=this.getAttribute('data-v'),r=rec(id);
      r.v=(r.v===v)?'':v;
      var card=this.closest('.feat');
      Array.prototype.forEach.call(card.querySelectorAll('.vbtn'),function(x){
        x.classList.toggle('on',x.getAttribute('data-v')===r.v)});
      queue(id);
    }});
  Array.prototype.forEach.call(document.querySelectorAll('textarea'),function(t){
    t.oninput=function(){var r=rec(this.getAttribute('data-id'));r.note=this.value;
